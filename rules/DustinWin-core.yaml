# Core：国内白名单 + Apple/Microsoft 完整规则进入全球直连；OneDrive 在 Microsoft 前进入节点选择；其余 MATCH；含 DNS、嗅探器和状态持久化。

ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS：fake-ip；解析 AAAA；国内域名按 policy 解析，其他直连流量使用国内 DoH，代理流量默认海外 DoH。
dns:
  enable: true
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
    - rule-set:private
    # MetaCubeX geosite cn（MRS）：国内 real-IP；路由仍用 cn-lite
    - rule-set:cn
  nameserver-policy:
    # 与 fake-ip-filter 同源：MetaCubeX cn + 私有
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 嗅探器：从 HTTP/TLS/QUIC 流量中提取域名，提升 TUN / redir-host 分流准确率。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

proxy-groups:
- name: 节点选择
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  proxies:
  - 自动测速
  - 手动切换
  - DIRECT

- name: 手动切换
  type: select
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

- name: 自动测速
  type: url-test
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50

- name: 全球直连
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  proxies:
  - DIRECT
  - 节点选择
  - 自动测速

- name: 广告拦截
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"
  proxies:
  - REJECT
  - DIRECT
  - 节点选择

rule-providers:
  private:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/private.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.list"
    interval: 86400
  ads:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/ads.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.list"
    interval: 86400
  privateip:
    type: http
    behavior: ipcidr
    format: text
    path: ./ruleset/dustinwin/privateip.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.list"
    interval: 86400
  apple:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/blackmatrix7/apple.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Apple/Apple.list"
    interval: 86400
  onedrive:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/blackmatrix7/onedrive.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OneDrive/OneDrive.list"
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/blackmatrix7/microsoft.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.list"
    interval: 86400
  games-cn:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/games-cn.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.list"
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/proxy.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.list"
    interval: 86400
  cn-lite:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/cn-lite.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn-lite.list"
    interval: 86400
  cnip:
    type: http
    behavior: ipcidr
    format: text
    path: ./ruleset/dustinwin/cnip.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.list"
    interval: 86400
  fakeip-filter:
    type: http
    behavior: domain
    format: text
    path: ./ruleset/dustinwin/fakeip-filter.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/fakeip-filter.list"
    interval: 86400
  # DNS-only：MetaCubeX geosite cn；勿用于路由（路由用 cn-lite）
  cn:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/cn.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    interval: 86400

rules:
- RULE-SET,private,DIRECT
- RULE-SET,privateip,DIRECT,no-resolve

# 广告域名默认拒绝；误伤时可在面板临时切换为直连或节点
- RULE-SET,ads,广告拦截

- RULE-SET,apple,全球直连
# OneDrive 须在 microsoft 前进入节点选择，避免被微软大类抢先直连
- RULE-SET,onedrive,节点选择
- RULE-SET,microsoft,全球直连
- RULE-SET,games-cn,全球直连

# 明确非中国域名进入节点选择（对齐 MetaCubeX geolocation-!cn；须在 cn-lite 前）
- RULE-SET,proxy,节点选择

- RULE-SET,cn-lite,全球直连

- RULE-SET,cnip,全球直连

- MATCH,节点选择
