ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  cache-algorithm: arc
  listen: ":53"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,gfw,fake-ip
    - MATCH,real-ip
  prefer-h3: false
  respect-rules: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
  nameserver-policy:
    "rule-set:gfw": "https://8.8.8.8/dns-query#节点选择"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场(?!节点)|订阅|通知|频道|过期|Traffic|Expire"
  filter-self: &filter-self "(?i)自建|^(私人|VPS|SELF)[-_ ]?"
  filter-node: &filter-node "(?i)官网|流量|到期|剩余|邀请|返利|订阅|通知|频道|过期|Traffic|Expire|自建|^(私人|VPS|SELF)[-_ ]?"
  filter-hk: &filter-hk "(?i)🇭🇰|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)"
  filter-us: &filter-us "(?i)🇺🇸|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)"
  filter-jp: &filter-jp "(?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)"
  filter-sg: &filter-sg "(?i)🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)"
  filter-mo: &filter-mo "(?i)🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)"
  filter-tw: &filter-tw "(?i)🇹🇼|台湾|台灣|臺灣|新北|高雄|Taiwan|Taipei|Kaohsiung|Taichung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)"
  other-region-exclude: &other-region-exclude "(?i)官网|流量|到期|剩余|邀请|返利|订阅|通知|频道|过期|Traffic|Expire|🇭🇰|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)|🇺🇸|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)|🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)|🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)|🇹🇼|台湾|台灣|臺灣|新北|高雄|Taiwan|Taipei|Kaohsiung|Taichung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)|自建|^(私人|VPS|SELF)[-_ ]?"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 60
    timeout: 3000
    max-failed-times: 2
    empty-fallback: COMPATIBLE
    tolerance: 50
    lazy: true
  fallback: &fallback
    type: fallback
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 60
    timeout: 3000
    max-failed-times: 2
    empty-fallback: COMPATIBLE
    lazy: true
  line-fallback: &line-fallback
    type: fallback
    proxies:
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 香港节点
      - 台湾节点
      - 澳门节点
      - 其他节点
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 3000
    max-failed-times: 2
    empty-fallback: COMPATIBLE
    lazy: true

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: *node-exclude
    proxies:
      - 自动测速
      - 故障转移
      - 线路故转
      - 自建优先
      - 自建节点
      - 香港节点
      - 新加坡节点
      - 日本节点
      - 美国节点
      - 澳门节点
      - 台湾节点
      - 其他节点
      - DIRECT
  - name: 自动测速
    <<: *url-test
  - name: 故障转移
    <<: *fallback
  - name: 线路故转
    <<: *line-fallback
  - name: 自建优先
    type: fallback
    proxies:
      - 自建节点
      - 线路故转
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 10
    timeout: 3000
    max-failed-times: 2
    lazy: true
  - name: 自建节点
    <<: *fallback
    filter: *filter-self
    interval: 10
  - name: 香港节点
    <<: *url-test
    filter: *filter-hk
    exclude-filter: *filter-node
  - name: 新加坡节点
    <<: *url-test
    filter: *filter-sg
    exclude-filter: *filter-node
  - name: 日本节点
    <<: *url-test
    filter: *filter-jp
    exclude-filter: *filter-node
  - name: 美国节点
    <<: *url-test
    filter: *filter-us
    exclude-filter: *filter-node
  - name: 澳门节点
    <<: *url-test
    filter: *filter-mo
    exclude-filter: *filter-node
  - name: 台湾节点
    <<: *url-test
    filter: *filter-tw
    exclude-filter: *filter-node
  - name: 其他节点
    type: select
    include-all: true
    exclude-filter: *other-region-exclude

rule-anchor:
  domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  private:
    <<: *mrs-domain
    path: ./ruleset/private.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs
  privateip:
    <<: *mrs-ip
    path: ./ruleset/privateip.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs
  gfw:
    <<: *mrs-domain
    path: ./ruleset/gfw.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/gfw.mrs

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,gfw,节点选择
  - MATCH,DIRECT
