ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: ":53"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,gfw,fake-ip
    - MATCH,real-ip
  prefer-h3: false
  respect-rules: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
  nameserver-policy:
    "rule-set:gfw": "https://8.8.8.8/dns-query#节点选择"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    proxies:
      - 自动测速
      - DIRECT
  - name: 自动测速
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true

rule-anchor:
  domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  private:
    <<: *mrs-domain
    path: ./ruleset/private.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs
  privateip:
    <<: *mrs-ip
    path: ./ruleset/privateip.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs
  gfw:
    <<: *mrs-domain
    path: ./ruleset/gfw.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/gfw.mrs

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,gfw,节点选择
  - MATCH,DIRECT
