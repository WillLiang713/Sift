ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns-anchor:
  domestic: &domestic-dns
    - https://223.5.5.5/dns-query
  overseas: &overseas-dns
    - "https://8.8.8.8/dns-query#节点选择"

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,apple-cn,real-ip
    - RULE-SET,microsoft-cn,real-ip
    - RULE-SET,google-cn,real-ip
    - RULE-SET,games-cn,real-ip
    - RULE-SET,proxy,fake-ip
    - MATCH,real-ip
  nameserver-policy:
    "rule-set:proxy": *overseas-dns
    "rule-set:cn,private,apple-cn,microsoft-cn,google-cn,games-cn": *domestic-dns
  respect-rules: true
  proxy-server-nameserver: *domestic-dns
  nameserver: *overseas-dns

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场(?!节点|故转|延迟)|订阅|通知|频道|过期|Traffic|Expire"
  filter-self: &filter-self "(?i)自建|^(私人|VPS|SELF)[-_ ]?"
  filter-hk: &filter-hk "(?i)🇭🇰|港|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)"
  filter-us: &filter-us "(?i)🇺🇸|美|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)"
  filter-jp: &filter-jp "(?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)"
  filter-sg: &filter-sg "(?i)🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)"
  filter-mo: &filter-mo "(?i)🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)"
  filter-tw: &filter-tw "(?i)🇹🇼|台|臺|台湾|台灣|臺灣|新北|高雄|Taiwan|Taipei|Kaohsiung|Taichung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)"
  other-region-exclude: &other-region-exclude "(?i)🇭🇰|港|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)|🇺🇸|美|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)|🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)|🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)|🇹🇼|台|臺|台湾|台灣|臺灣|新北|高雄|Taiwan|Taipei|Kaohsiung|Taichung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)|自建|^(私人|VPS|SELF)[-_ ]?"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 1000
    max-failed-times: 1
    tolerance: 50
    lazy: true
  fallback: &fallback
    type: fallback
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 1000
    max-failed-times: 1
    lazy: true
  airport-fallback: &airport-fallback
    type: fallback
    proxies:
      - 新加坡节点
      - 日本节点
      - 美国节点
      - 香港节点
      - 澳门节点
      - 台湾节点
      - 其他节点
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 1000
    max-failed-times: 1
    lazy: true
  proxy-options: &proxy-options
    - 节点选择
    - 自动测速
    - 故障转移
    - 自建优先
    - 机场故转
    - 自建节点
    - 机场延迟
    - 香港节点
    - 美国节点
    - 日本节点
    - 新加坡节点
    - 台湾节点
    - 其他节点
    - DIRECT

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: *node-exclude
    proxies:
      - 自动测速
      - 故障转移
      - 自建优先
      - 机场故转
      - 自建节点
      - 机场延迟
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 其他节点
      - DIRECT
  - name: 自动测速
    <<: *url-test
  - name: 故障转移
    <<: *fallback
  - name: 自建节点
    <<: *fallback
    filter: *filter-self
    interval: 10
  - name: 机场故转
    <<: *airport-fallback
  - name: 自建优先
    type: fallback
    proxies:
      - 自建节点
      - 机场故转
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 10
    timeout: 1000
    max-failed-times: 1
    lazy: true
  - name: 机场延迟
    <<: *url-test
    proxies:
      - 香港节点
      - 澳门节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 其他节点
  - name: AI
    type: select
    proxies: *proxy-options
  - name: 流媒体
    type: select
    proxies: *proxy-options
  - name: 游戏平台
    type: select
    proxies: *proxy-options
  - name: Telegram
    type: select
    proxies: *proxy-options
  - name: 香港节点
    <<: *url-test
    filter: *filter-hk
    exclude-filter: *filter-self
  - name: 澳门节点
    <<: *url-test
    filter: *filter-mo
    exclude-filter: *filter-self
  - name: 美国节点
    <<: *url-test
    filter: *filter-us
    exclude-filter: *filter-self
  - name: 日本节点
    <<: *url-test
    filter: *filter-jp
    exclude-filter: *filter-self
  - name: 新加坡节点
    <<: *url-test
    filter: *filter-sg
    exclude-filter: *filter-self
  - name: 台湾节点
    <<: *url-test
    filter: *filter-tw
    exclude-filter: *filter-self
  - name: 其他节点
    type: select
    include-all: true
    exclude-filter: *other-region-exclude
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
      - 故障转移
  - name: 漏网之鱼
    type: select
    proxies: *proxy-options

rule-anchor:
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  mrs-ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  private:
    <<: *mrs-domain
    path: ./ruleset/private.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs"
  privateip:
    <<: *mrs-ip
    path: ./ruleset/privateip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs"
  apple-cn:
    <<: *mrs-domain
    path: ./ruleset/apple-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/apple-cn.mrs"
  microsoft-cn:
    <<: *mrs-domain
    path: ./ruleset/microsoft-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/microsoft-cn.mrs"
  google-cn:
    <<: *mrs-domain
    path: ./ruleset/google-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/google-cn.mrs"
  games-cn:
    <<: *mrs-domain
    path: ./ruleset/games-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.mrs"
  steam-cdn-ip:
    <<: *mrs-ip
    path: ./ruleset/steam-cdn-ip.mrs
    url: "https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_IP.mrs"
  ai:
    <<: *mrs-domain
    path: ./ruleset/ai.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ai.mrs"
  media:
    <<: *mrs-domain
    path: ./ruleset/media.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/media.mrs"
  mediaip:
    <<: *mrs-ip
    path: ./ruleset/mediaip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/mediaip.mrs"
  games:
    <<: *mrs-domain
    path: ./ruleset/games.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games.mrs"
  telegramip:
    <<: *mrs-ip
    path: ./ruleset/telegramip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/telegramip.mrs"
  proxy:
    <<: *mrs-domain
    path: ./ruleset/proxy.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.mrs"
  cnip:
    <<: *mrs-ip
    path: ./ruleset/cnip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs"
  cn:
    <<: *mrs-domain
    path: ./ruleset/cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.mrs"

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,apple-cn,全球直连
  - RULE-SET,microsoft-cn,全球直连
  - RULE-SET,google-cn,全球直连
  - RULE-SET,games-cn,全球直连
  - RULE-SET,ai,AI
  - RULE-SET,games,游戏平台
  - RULE-SET,media,流媒体
  - RULE-SET,proxy,节点选择
  - RULE-SET,cn,全球直连
  - RULE-SET,mediaip,流媒体
  - RULE-SET,telegramip,Telegram
  - RULE-SET,steam-cdn-ip,全球直连
  - RULE-SET,cnip,全球直连
  - MATCH,漏网之鱼
