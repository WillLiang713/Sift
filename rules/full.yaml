# 综合主模板 / Full：无节点。
# 规则层：DustinWin MRS 骨架 + MetaCubeX 品牌/GitHub/DNS MRS（非单源）。
# microsoft 过宽 → github、onedrive 前置领出；proxy 在 cn-lite 前。

ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS：fake-ip 白名单；DustinWin proxy 为白名单；MetaCubeX cn + private 走国内 DoH。
dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    # DustinWin proxy（geolocation-!cn + gfwlist）：含 googleapis.cn 等全球 .cn 例外
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 嗅探器：从 HTTP/TLS/QUIC 提取域名；skip-domain 避免内网/连通性/推送误嗅探。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

