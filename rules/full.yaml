ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns-anchor:
  domestic: &domestic-dns
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  overseas: &overseas-dns
    - "https://8.8.8.8/dns-query#节点选择"
    - "https://1.1.1.1/dns-query#节点选择"

dns:
  enable: true
  cache-algorithm: arc
  listen: ":53"
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,fakeip-filter,real-ip
    - RULE-SET,private,real-ip
    - RULE-SET,custom-direct-domain,real-ip
    - RULE-SET,apple-cn,real-ip
    - RULE-SET,microsoft-cn,real-ip
    - RULE-SET,games-cn,real-ip
    - RULE-SET,ai,fake-ip
    - RULE-SET,games,fake-ip
    - RULE-SET,media,fake-ip
    - RULE-SET,telegram,fake-ip
    - RULE-SET,proxy,fake-ip
    - RULE-SET,cn,real-ip
    - MATCH,fake-ip
  prefer-h3: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver: *domestic-dns
  nameserver: *overseas-dns
  nameserver-policy:
    "+.jsdelivr.net": *domestic-dns
    "rule-set:private,custom-direct-domain,apple-cn,microsoft-cn,games-cn": *domestic-dns
    "rule-set:ai,games,media,telegram,proxy": *overseas-dns
    "rule-set:cn": *domestic-dns

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|重置|套餐|网址|公告|群组|距离|Traffic|Expire"
  filter-hk: &filter-hk "(?i)🇭🇰|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)"
  filter-us: &filter-us "(?i)🇺🇸|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|旧金山|拉斯维加斯|洛杉矶|迈阿密|纽约|圣何塞|圣克拉拉|西雅图|华盛顿|亚特兰大|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon ?Valley|San ?Francisco|Las ?Vegas|Los ?Angeles|Miami|New ?York|San ?Jose|Santa ?Clara|Seattle|Washington|Atlanta|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)"
  filter-jp: &filter-jp "(?i)🇯🇵|日本|川日|东京|大阪|名古屋|福冈|札幌|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|Nagoya|Fukuoka|Sapporo|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)"
  filter-sg: &filter-sg "(?i)🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)"
  filter-mo: &filter-mo "(?i)🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)"
  filter-tw: &filter-tw "(?i)🇹🇼|台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|Taiwan|Taipei|Taichung|Tainan|Changhua|Kaohsiung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)"
  other-region-exclude: &other-region-exclude "(?i)\
    官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|重置|套餐|网址|公告|群组|距离|Traffic|Expire|\
    🇭🇰|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)|\
    🇺🇸|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|旧金山|拉斯维加斯|洛杉矶|迈阿密|纽约|圣何塞|圣克拉拉|西雅图|华盛顿|亚特兰大|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon ?Valley|San ?Francisco|Las ?Vegas|Los ?Angeles|Miami|New ?York|San ?Jose|Santa ?Clara|Seattle|Washington|Atlanta|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)|\
    🇯🇵|日本|川日|东京|大阪|名古屋|福冈|札幌|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|Nagoya|Fukuoka|Sapporo|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)|\
    🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)|\
    🇲🇴|澳門|澳门|Macau|Macao|(^|[^A-Za-z])(MO|MAC)([^A-Za-z]|$)|\
    🇹🇼|台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|Taiwan|Taipei|Taichung|Tainan|Changhua|Kaohsiung|(^|[^A-Za-z])(TW|TPE|TSA|KHH|RMQ)([^A-Za-z]|$)"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 60
    timeout: 3000
    max-failed-times: 2
    empty-fallback: COMPATIBLE
    tolerance: 50
    lazy: true
  fallback: &fallback
    type: fallback
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 2000
    max-failed-times: 1
    empty-fallback: COMPATIBLE
    lazy: true
  proxy-options: &proxy-options
    - 节点选择
    - 自动测速
    - 故障转移
    - 香港节点
    - 新加坡节点
    - 日本节点
    - 美国节点
    - 澳门节点
    - 台湾节点
    - 其他节点
    - 全部节点
    - DIRECT

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动测速
      - 故障转移
      - 香港节点
      - 新加坡节点
      - 日本节点
      - 美国节点
      - 澳门节点
      - 台湾节点
      - 其他节点
      - 全部节点
      - DIRECT
  - name: 自动测速
    <<: *url-test
  - name: 故障转移
    <<: *fallback
  - name: 全部节点
    type: select
    include-all: true
    exclude-filter: *node-exclude
  - name: AI
    type: select
    proxies: *proxy-options
  - name: 流媒体
    type: select
    proxies: *proxy-options
  - name: 游戏平台
    type: select
    proxies: *proxy-options
  - name: Telegram
    type: select
    proxies: *proxy-options
  - name: 香港节点
    <<: *url-test
    filter: *filter-hk
  - name: 新加坡节点
    <<: *url-test
    filter: *filter-sg
  - name: 日本节点
    <<: *url-test
    filter: *filter-jp
  - name: 美国节点
    <<: *url-test
    filter: *filter-us
  - name: 澳门节点
    <<: *url-test
    filter: *filter-mo
  - name: 台湾节点
    <<: *url-test
    filter: *filter-tw
  - name: 其他节点
    type: select
    include-all: true
    exclude-filter: *other-region-exclude
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
      - 故障转移
  - name: 漏网之鱼
    type: select
    proxies: *proxy-options

rule-anchor:
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  mrs-ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  fakeip-filter:
    <<: *mrs-domain
    path: ./ruleset/fakeip-filter.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/fakeip-filter.mrs
  private:
    <<: *mrs-domain
    path: ./ruleset/private.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs
  privateip:
    <<: *mrs-ip
    path: ./ruleset/privateip.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs
  apple-cn:
    <<: *mrs-domain
    path: ./ruleset/apple-cn.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/apple-cn.mrs
  microsoft-cn:
    <<: *mrs-domain
    path: ./ruleset/microsoft-cn.mrs
