    path: ./ruleset/ai.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ai.mrs
  media:
    <<: *mrs-domain
    path: ./ruleset/media.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/media.mrs
  mediaip:
    <<: *mrs-ip
    path: ./ruleset/mediaip.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/mediaip.mrs
  games:
    <<: *mrs-domain
    path: ./ruleset/games.mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games.mrs
  telegram:
