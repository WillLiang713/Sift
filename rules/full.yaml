- RULE-SET,apple-cn,全球直连
- RULE-SET,microsoft-cn,全球直连
- RULE-SET,games-cn,全球直连

- RULE-SET,apple,苹果服务

- RULE-SET,ai,AI

- RULE-SET,games,游戏平台

- RULE-SET,mediaip,流媒体

# OneDrive 须在 microsoft 前
- RULE-SET,onedrive,OneDrive

- RULE-SET,microsoft,微软服务

- RULE-SET,telegramip,Telegram

# Google 全品牌进入谷歌服务（须在 proxy / cn-lite 前）
- RULE-SET,google,谷歌服务

# 明确非中国域名进入节点选择（须在场景组之后、cn-lite 前）
- RULE-SET,proxy,节点选择

- RULE-SET,cn-lite,全球直连

- RULE-SET,cnip,全球直连

- MATCH,漏网之鱼

