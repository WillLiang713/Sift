rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,custom-direct-domain,全球直连
  - RULE-SET,custom-direct-ip,全球直连,no-resolve
  - RULE-SET,apple-cn,全球直连
  - RULE-SET,microsoft-cn,全球直连
  - RULE-SET,games-cn,全球直连
  - RULE-SET,ai,AI
  - RULE-SET,games,游戏平台
  - RULE-SET,media,流媒体
  - RULE-SET,telegram,Telegram
  - RULE-SET,proxy,节点选择
  - RULE-SET,cn,全球直连
  - RULE-SET,mediaip,流媒体,no-resolve
  - RULE-SET,telegramip,Telegram,no-resolve
  - RULE-SET,steam-cdn-ip,全球直连
  - RULE-SET,cnip,全球直连
  - MATCH,漏网之鱼
