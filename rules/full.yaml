ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns-anchor:
  domestic: &domestic-dns
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  overseas: &overseas-dns
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy": *overseas-dns
    "rule-set:cn,private": *domestic-dns
  respect-rules: false
  direct-nameserver: *domestic-dns
  proxy-server-nameserver: *domestic-dns
  nameserver: *overseas-dns

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
  filter-hk: &filter-hk "(?i)🇭🇰|港|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)"
  filter-us: &filter-us "(?i)🇺🇸|美|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)"
  filter-jp: &filter-jp "(?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)"
  filter-sg: &filter-sg "(?i)🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)"
  other-region-exclude: &other-region-exclude "(?i)🇭🇰|港|香港|HongKong|Hong Kong|(^|[^A-Za-z])(HK|HKG)([^A-Za-z]|$)|🇺🇸|美|美国|United ?States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|(^|[^A-Za-z])(US|USA|LAX|SFO|SJC|SEA|JFK|ORD|DFW|IAD|MIA|ATL)([^A-Za-z]|$)|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|NRT|HND|KIX|CTS|FUK)([^A-Za-z]|$)|🇸🇬|Singapore|新加坡|狮城|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$)"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
  proxy-options: &proxy-options
    - 节点选择
    - 自动测速
    - 香港节点
    - 美国节点
    - 日本节点
    - 新加坡节点
    - 其他节点
    - 手动切换
    - DIRECT
  direct-first-options: &direct-first-options
    - 全球直连
    - 节点选择
    - 自动测速
    - 香港节点
    - 美国节点
    - 日本节点
    - 新加坡节点
    - 其他节点
    - 手动切换

proxy-groups:
  - name: 节点选择
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png"
    proxies:
      - 自动测速
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 其他节点
      - 手动切换
      - DIRECT
  - name: 手动切换
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"
  - name: 自动测速
    <<: *url-test
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"
  - name: AI
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png"
    proxies: *proxy-options
  - name: 流媒体
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png"
    proxies: *proxy-options
  - name: 游戏平台
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png"
    proxies: *proxy-options
  - name: Telegram
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram_X.png"
    proxies: *proxy-options
  - name: 苹果服务
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png"
    proxies: *direct-first-options
  - name: 谷歌服务
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png"
    proxies: *proxy-options
  - name: 微软服务
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Windows_11.png"
    proxies: *direct-first-options
  - name: GitHub
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png"
    proxies: *proxy-options
  - name: 香港节点
    <<: *url-test
    filter: *filter-hk
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
  - name: 美国节点
    <<: *url-test
    filter: *filter-us
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png"
  - name: 日本节点
    <<: *url-test
    filter: *filter-jp
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png"
  - name: 新加坡节点
    <<: *url-test
    filter: *filter-sg
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png"
  - name: 其他节点
    type: select
    include-all: true
    exclude-filter: *other-region-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png"
  - name: 全球直连
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png"
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
  - name: 广告拦截
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png"
    proxies:
      - REJECT
      - PASS
  - name: 漏网之鱼
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png"
    proxies: *proxy-options

rule-anchor:
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  mrs-ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

