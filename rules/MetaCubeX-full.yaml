rules:
# 局域网 / 私有地址
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve

# GitHub / Copilot：高优先级走节点，避免被 Microsoft / 场景大类抢先命中
- GEOSITE,github,节点选择

# 中国区 / 国内服务直连补充
- GEOSITE,apple@cn,全球直连
- GEOSITE,microsoft@cn,全球直连
- GEOSITE,category-games@cn,全球直连

# Apple 全品牌服务
- GEOSITE,apple,苹果服务

# 高优先级场景分流：游戏必须早于 category-entertainment，避免被娱乐大类抢先命中。
- GEOSITE,category-ai-!cn,AI
- GEOSITE,category-game-platforms-download,游戏平台
- GEOSITE,category-games,游戏平台
- GEOSITE,category-entertainment,流媒体

# 特殊品牌服务：OneDrive 先于 Microsoft，避免被微软大类抢先命中。
- GEOSITE,onedrive,OneDrive
- GEOSITE,microsoft,微软服务

# IP 型服务
- GEOIP,telegram,Telegram

# Google 全品牌（含 googleapis.cn / gstatic.cn 等 .cn 全球服务）；放在 geolocation-!cn 前，避免被通用非中国层抢走
# 流媒体等场景组更靠前，YouTube 等仍优先进 流媒体
- GEOSITE,google,谷歌服务

# 明确非中国域名
- GEOSITE,geolocation-!cn,节点选择

# 国内兜底
- GEOSITE,cn,全球直连
- GEOIP,CN,全球直连

# 最终兜底
- MATCH,漏网之鱼
