# Core Geodata：国内白名单 + Apple/Microsoft 完整规则进入全球直连；OneDrive 在 Microsoft 前进入节点选择；其余 MATCH；使用 MetaCubeX GEOSITE/GEOIP。

ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# Geodata：路由使用 MetaCubeX geosite / geoip / metadb；DNS fake-ip 过滤单独补充 domain provider。
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

# DNS：fake-ip；解析 AAAA；国内/私有域名按 policy 解析，其他直连流量使用国内 DoH，代理流量默认海外 DoH。
dns:
  enable: true
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
    - geosite:private
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 嗅探器：从 HTTP/TLS/QUIC 流量中提取域名，提升 TUN / redir-host 分流准确率。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# DNS 专用 fake-ip 过滤补充：MetaCubeX geosite 当前没有 fakeip-filter 分类。
rule-providers:
  fakeip-filter:
    type: http
    behavior: domain
    format: text
    interval: 86400
    path: ./ruleset/dustinwin/fakeip-filter.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/fakeip-filter.list"

proxy-groups:
- name: 节点选择
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  proxies:
  - 自动测速
  - 手动切换
  - DIRECT

- name: 手动切换
  type: select
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

- name: 自动测速
  type: url-test
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50

- name: 全球直连
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  proxies:
  - DIRECT
  - 节点选择
  - 自动测速

- name: 广告拦截
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"
  proxies:
  - REJECT
  - DIRECT
  - 节点选择

rules:
# 局域网 / 私有地址
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve

# 广告域名默认拒绝；误伤时可在面板临时切换为直连或节点
- GEOSITE,category-ads-all,广告拦截

# GitHub / Copilot：高优先级走节点，避免被 Microsoft 大类抢先直连
- GEOSITE,github,节点选择

# 中国区 / 国内服务直连补充
- GEOSITE,category-games@cn,全球直连
- GEOSITE,apple,全球直连
# OneDrive 须在 microsoft 前进入节点选择，避免被微软大类抢先直连
- GEOSITE,onedrive,节点选择
- GEOSITE,microsoft,全球直连

# 明确非中国域名优先走节点
- GEOSITE,geolocation-!cn,节点选择
# Google 全球服务在 .cn 上的例外（如 googleapis.cn / gstatic.cn）：在 geolocation-!cn 中缺失，须在 cn 前单独放行；无 Google UI 组
- GEOSITE,google,节点选择

# 国内兜底
- GEOSITE,cn,全球直连
- GEOIP,CN,全球直连

# 最终兜底
- MATCH,节点选择
