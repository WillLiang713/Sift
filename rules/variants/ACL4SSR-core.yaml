ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: false
geox-url:
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy":
      - "https://1.1.1.1/dns-query#DNS"
      - "https://8.8.8.8/dns-query#DNS"
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: false
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - "https://1.1.1.1/dns-query#DNS"
    - "https://8.8.8.8/dns-query#DNS"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

proxy-groups:
  - name: 节点选择
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png"
    proxies:
      - 自动测速
      - 手动切换
      - DIRECT
  - name: 手动切换
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png"
  - name: 自动测速
    type: url-test
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
  - name: DNS
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hijacking.png"
    proxies:
      - 节点选择
      - 自动测速
      - 手动切换
      - DIRECT
  - name: 苹果服务
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png"
    proxies:
      - 直连
      - 节点选择
      - 自动测速
      - 手动切换
  - name: 微软服务
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Windows_11.png"
    proxies:
      - 直连
      - 节点选择
      - 自动测速
      - 手动切换
  - name: OneDrive
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/OneDrive.png"
    proxies:
      - 节点选择
      - 自动测速
      - 手动切换
      - DIRECT
  - name: 直连
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png"
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
  - name: 漏网之鱼
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png"
    proxies:
      - 自动测速
      - 节点选择
      - 手动切换
      - DIRECT

rule-anchor:
  classical: &classical {type: http, behavior: classical, format: text, interval: 86400, proxy: DIRECT}
  text-domain: &text-domain {type: http, behavior: domain, format: text, interval: 86400, proxy: DIRECT}
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  LocalAreaNetwork:
    <<: *classical
    path: ./ruleset/acl4ssr/LocalAreaNetwork.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
  UnBan:
    <<: *classical
    path: ./ruleset/acl4ssr/UnBan.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list"
  ChinaDomain:
    <<: *classical
    path: ./ruleset/acl4ssr/ChinaDomain.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list"
  ChinaIp:
    <<: *classical
    path: ./ruleset/acl4ssr/ChinaIp.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list"
  ChinaIpV6:
    <<: *classical
    path: ./ruleset/acl4ssr/ChinaIpV6.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIpV6.list"
  GoogleCN:
    <<: *classical
    path: ./ruleset/acl4ssr/GoogleCN.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list"
  SteamCN:
    <<: *classical
    path: ./ruleset/acl4ssr/SteamCN.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list"
  Apple:
    <<: *classical
    path: ./ruleset/acl4ssr/Apple.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list"
  OneDrive:
    <<: *classical
    path: ./ruleset/acl4ssr/OneDrive.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list"
  Microsoft:
    <<: *classical
    path: ./ruleset/acl4ssr/Microsoft.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list"
  ProxyLite:
    <<: *classical
    path: ./ruleset/acl4ssr/ProxyLite.list
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list"
  proxy:
    <<: *text-domain
    path: ./ruleset/dustinwin/proxy.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.list"
  private:
    <<: *text-domain
    path: ./ruleset/dustinwin/private.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.list"
  cn:
    <<: *mrs-domain
    path: ./ruleset/metacubex/cn.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"

rules:
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,GoogleCN,直连
  - RULE-SET,SteamCN,直连
  - RULE-SET,Apple,苹果服务
  - RULE-SET,OneDrive,OneDrive
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,ProxyLite,节点选择
  - RULE-SET,ChinaDomain,直连
  - RULE-SET,ChinaIp,直连
  - RULE-SET,ChinaIpV6,直连
  - MATCH,漏网之鱼
