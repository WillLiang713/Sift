ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - geosite:geolocation-!cn
    - geosite:google
  nameserver-policy:
    "geosite:geolocation-!cn,google":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

proxy-groups:
  - name: 节点选择
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    proxies:
      - 自动测速
      - 手动切换
      - DIRECT
  - name: 手动切换
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: 自动测速
    type: url-test
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
  - name: 全球直连
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
  - name: 广告拦截
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"
    proxies:
      - REJECT
      - DIRECT
      - 节点选择
  - name: 漏网之鱼
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"
    proxies:
      - 节点选择
      - 自动测速
      - 手动切换
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,广告拦截
  - GEOSITE,github,节点选择
  - GEOSITE,category-games@cn,全球直连
  - GEOSITE,apple,全球直连
  - GEOSITE,onedrive,节点选择
  - GEOSITE,microsoft,全球直连
  - GEOSITE,geolocation-!cn,节点选择
  - GEOSITE,google,节点选择
  - GEOSITE,cn,全球直连
  - GEOIP,CN,全球直连
  - MATCH,漏网之鱼
