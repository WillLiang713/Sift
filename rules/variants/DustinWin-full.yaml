- RULE-SET,ai,AI

- RULE-SET,games,游戏平台

- RULE-SET,mediaip,流媒体

- RULE-SET,onedrive,OneDrive

- RULE-SET,microsoft,微软服务

- RULE-SET,telegramip,Telegram

