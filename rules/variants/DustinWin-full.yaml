ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: false
geox-url:
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy":
      - "https://1.1.1.1/dns-query#DNS"
      - "https://8.8.8.8/dns-query#DNS"
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: false
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - "https://1.1.1.1/dns-query#DNS"
    - "https://8.8.8.8/dns-query#DNS"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

proxy-groups:
  - name: 节点选择
    type: select
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    proxies:
      - 自动测速
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 其他节点
      - 手动切换
      - DIRECT
  - name: 手动切换
    type: select
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: 自动测速
    type: url-test
    include-all: true
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
