  - name: 香港节点
    type: url-test
    include-all: true
    filter: "(?i)🇭🇰|港|HK|HKG|HongKong|Hong Kong|香港"
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Vbaethon/HOMOMIX@main/Icon/Color/Large/Hong_Kong.png"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
  - name: 美国节点
    type: url-test
    include-all: true
    filter: "(?i)🇺🇸|美|US|USA|United ?States|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago"
    exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    icon: "https://cdn.jsdelivr.net/gh/Vbaethon/HOMOMIX@main/Icon/Color/Large/USA.png"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
  - name: 日本节点
