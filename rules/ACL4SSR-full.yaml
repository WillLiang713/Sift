# ACL4SSR / Full：无节点规则、策略组、DNS、嗅探器和状态持久化。

ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS：fake-ip 白名单；明确非中国域名使用 fake-IP，其余域名返回 real-IP。
dns:
  enable: true
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    # DNS-only DustinWin proxy：弥补 ACL classical ProxyLite 不适合 DNS 引用
    - rule-set:proxy
  nameserver-policy:
    # 明确代理域名使用海外 DoH（优先于 cn，避免如 googleapis.cn 等 .cn 代理域名被国内 DNS 影响）
    "rule-set:proxy":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    # MetaCubeX cn + 私有域名仍使用国内 DoH
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 嗅探器：从 HTTP/TLS/QUIC 流量中提取域名，提升 TUN / redir-host 分流准确率。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

