ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: false
geox-url:
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

dns-anchor:
  domestic: &domestic-dns
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  overseas: &overseas-dns
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy": *overseas-dns
    "rule-set:cn,private": *domestic-dns
  respect-rules: false
  direct-nameserver: *domestic-dns
  proxy-server-nameserver: *domestic-dns
  nameserver: *overseas-dns

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
  proxy-options: &proxy-options
    - 节点选择
    - 自动测速
    - DIRECT
  direct-first-options: &direct-first-options
    - 直连
    - 节点选择
    - 自动测速

proxy-groups:
  # 无地区组：节点入口和服务组直接包含全部可用节点，同时过滤订阅信息节点。
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png"
    proxies:
      - 自动测速
      - DIRECT
  - name: 自动测速
    <<: *url-test
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"
  - name: 苹果服务
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png"
    proxies: *direct-first-options
  - name: 微软服务
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Windows_11.png"
    proxies: *direct-first-options
  - name: 直连
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png"
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
  - name: 漏网之鱼
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png"
    proxies: *proxy-options

rule-anchor:
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  mrs-ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}
  # blackmatrix7 品牌集（classical text：含 DOMAIN*/IP-CIDR 混合规则，勿改为 domain；jsDelivr 直连友好）
  bm-classical: &bm-classical {type: http, behavior: classical, format: text, interval: 86400, proxy: DIRECT}

rule-providers:
  private:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/private.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs"
  privateip:
    <<: *mrs-ip
    path: ./ruleset/dustinwin/privateip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs"
  github:
    <<: *bm-classical
    path: ./ruleset/blackmatrix7/github.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GitHub/GitHub.list"
  apple:
    <<: *bm-classical
    path: ./ruleset/blackmatrix7/apple.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Apple/Apple.list"
  onedrive:
    <<: *bm-classical
    path: ./ruleset/blackmatrix7/onedrive.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OneDrive/OneDrive.list"
  microsoft:
    <<: *bm-classical
    path: ./ruleset/blackmatrix7/microsoft.list
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.list"
  games-cn:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/games-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.mrs"
  proxy:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/proxy.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.mrs"
  cn-lite:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/cn-lite.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn-lite.mrs"
  cnip:
    <<: *mrs-ip
    path: ./ruleset/dustinwin/cnip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs"
  cn:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.mrs"

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,github,节点选择
  - RULE-SET,apple,苹果服务
  - RULE-SET,onedrive,微软服务
  - RULE-SET,microsoft,微软服务
  - RULE-SET,games-cn,直连
  - RULE-SET,proxy,节点选择
  - RULE-SET,cn-lite,直连
  - RULE-SET,cnip,直连
  - MATCH,漏网之鱼
