# 综合主模板 / Core：国内白名单 + Apple/Microsoft 直连；github/onedrive 在 microsoft 前代理；其余 MATCH。
# 规则层：DustinWin MRS + MetaCubeX 品牌/GitHub/DNS MRS。

ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS：fake-ip 白名单；DustinWin proxy 为白名单；MetaCubeX cn + private 走国内 DoH。
dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    # DustinWin proxy（geolocation-!cn + gfwlist）：含 googleapis.cn 等全球 .cn 例外
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "rule-set:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  respect-rules: true
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# 嗅探器：从 HTTP/TLS/QUIC 提取域名；skip-domain 避免内网/连通性/推送误嗅探。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

proxy-groups:
- name: 节点选择
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  proxies:
  - 自动测速
  - 手动切换
  - DIRECT

- name: 手动切换
  type: select
  include-all: true
  exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

- name: 自动测速
  type: url-test
  include-all: true
  exclude-filter: "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  timeout: 3000
  tolerance: 50

- name: 全球直连
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  proxies:
  - DIRECT
  - 节点选择
  - 自动测速

- name: 广告拦截
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"
  proxies:
  - REJECT
  - DIRECT
  - 节点选择


rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/dustinwin/private.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs"
    interval: 86400
    proxy: DIRECT
  ads:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/dustinwin/ads.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.mrs"
    interval: 86400
    proxy: DIRECT
  privateip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./ruleset/dustinwin/privateip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs"
    interval: 86400
    proxy: DIRECT
  github:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/github.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"
    interval: 86400
    proxy: DIRECT
  apple:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/apple.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"
    interval: 86400
    proxy: DIRECT
  onedrive:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/onedrive.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs"
    interval: 86400
    proxy: DIRECT
  microsoft:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/microsoft.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
    interval: 86400
    proxy: DIRECT
  games-cn:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/dustinwin/games-cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.mrs"
    interval: 86400
    proxy: DIRECT
  proxy:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/dustinwin/proxy.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.mrs"
    interval: 86400
    proxy: DIRECT
  cn-lite:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/dustinwin/cn-lite.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn-lite.mrs"
    interval: 86400
    proxy: DIRECT
  cnip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./ruleset/dustinwin/cnip.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs"
    interval: 86400
    proxy: DIRECT
  # DNS-only：MetaCubeX geosite cn；勿用于路由（路由用 cn-lite）
  cn:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/metacubex/cn.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    interval: 86400
    proxy: DIRECT

rules:
- RULE-SET,private,DIRECT
- RULE-SET,privateip,DIRECT,no-resolve

- RULE-SET,ads,广告拦截

# GitHub/Copilot 先于 microsoft，避免被微软大类直连
- RULE-SET,github,节点选择

- RULE-SET,apple,全球直连
# OneDrive 须在 microsoft 前进入节点选择
- RULE-SET,onedrive,节点选择
- RULE-SET,microsoft,全球直连
- RULE-SET,games-cn,全球直连

- RULE-SET,proxy,节点选择

- RULE-SET,cn-lite,全球直连

- RULE-SET,cnip,全球直连

- MATCH,节点选择

