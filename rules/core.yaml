ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: ":53"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,cn-lite,real-ip
    - MATCH,fake-ip
  prefer-h3: false
  respect-rules: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - "https://8.8.8.8/dns-query#节点选择"
  nameserver-policy:
    "rule-set:private,cn-lite": https://223.5.5.5/dns-query

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
    proxies:
      - 自动测速
      - DIRECT
  - name: 自动测速
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true

rule-anchor:
  domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  private:
    <<: *mrs-domain
    path: ./ruleset/private.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs
  privateip:
    <<: *mrs-ip
    path: ./ruleset/privateip.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs
  cn-lite:
    <<: *mrs-domain
    path: ./ruleset/cn-lite.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn-lite.mrs
  cnip:
    <<: *mrs-ip
    path: ./ruleset/cnip.mrs
    url: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,cn-lite,DIRECT
  - RULE-SET,cnip,DIRECT
  - MATCH,节点选择
