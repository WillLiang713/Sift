ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns-anchor:
  domestic: &domestic-dns
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  overseas: &overseas-dns
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"

dns:
  enable: true
  prefer-h3: false
  ipv6: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - rule-set:proxy
  nameserver-policy:
    "rule-set:proxy": *overseas-dns
    "rule-set:cn,private": *domestic-dns
  respect-rules: false
  direct-nameserver: *domestic-dns
  proxy-server-nameserver: *domestic-dns
  nameserver: *overseas-dns

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "Mijia Cloud"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"

group-anchor:
  node-exclude: &node-exclude "(?i)官网|流量|到期|剩余|邀请|返利|机场|订阅|通知|频道|过期|Traffic|Expire"
  url-test: &url-test
    type: url-test
    include-all: true
    exclude-filter: *node-exclude
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
  proxy-options: &proxy-options
    - 节点选择
    - 自动测速
    - DIRECT
  direct-first-options: &direct-first-options
    - 全球直连
    - 节点选择
    - 自动测速

proxy-groups:
  # 无地区组：节点入口和服务组直接包含全部可用节点，同时过滤订阅信息节点。
  - name: 节点选择
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png"
    proxies:
      - 自动测速
      - DIRECT
  - name: 自动测速
    <<: *url-test
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"
  - name: 苹果服务
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_1.png"
    proxies: *direct-first-options
  - name: 微软服务
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Windows_11.png"
    proxies: *direct-first-options
  - name: 全球直连
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png"
    proxies:
      - DIRECT
      - 节点选择
      - 自动测速
  - name: 广告拦截
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png"
    proxies:
      - REJECT
      - PASS
  - name: 漏网之鱼
    type: select
    include-all: true
    exclude-filter: *node-exclude
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png"
    proxies: *proxy-options

rule-anchor:
  # MetaCubeX geosite 品牌集（纯 domain MRS；github 须前置，因 geosite microsoft 含 github）
  mrs-domain: &mrs-domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}
  mrs-ip: &mrs-ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}

rule-providers:
  ads:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/ads.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.mrs"
  private:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/private.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs"
  privateip:
    <<: *mrs-ip
    path: ./ruleset/dustinwin/privateip.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs"
  github:
    <<: *mrs-domain
    path: ./ruleset/metacubex/github.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs"
  apple:
    <<: *mrs-domain
    path: ./ruleset/metacubex/apple.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs"
  microsoft:
    <<: *mrs-domain
    path: ./ruleset/metacubex/microsoft.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs"
  games-cn:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/games-cn.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.mrs"
  proxy:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/proxy.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.mrs"
  cn-lite:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/cn-lite.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn-lite.mrs"
  cnip:
    <<: *mrs-ip
    path: ./ruleset/dustinwin/cnip.list
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs"
  cn:
    <<: *mrs-domain
    path: ./ruleset/dustinwin/cn.mrs
    url: "https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.mrs"

rules:
  - RULE-SET,ads,广告拦截
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,github,节点选择
  - RULE-SET,apple,苹果服务
  - RULE-SET,microsoft,微软服务
  - RULE-SET,games-cn,全球直连
  - RULE-SET,proxy,节点选择
  - RULE-SET,cn-lite,全球直连
  - RULE-SET,cnip,全球直连
  - MATCH,漏网之鱼
