# Core：国内白名单 + Apple/Microsoft 完整规则进入全球直连，其余 MATCH。

unified-delay: true
tcp-concurrent: true

# DNS：fake-ip；默认海外 DoH，国内/Apple/Microsoft 白名单规则返回真实 IP。
dns:
  enable: true
  listen: ":53"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
    - rule-set:private
    - rule-set:google-cn
    - rule-set:apple
    - rule-set:microsoft
    - rule-set:games-cn
    - rule-set:cn-dns
  nameserver-policy:
    "rule-set:google-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:apple":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:microsoft":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:games-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:cn-dns":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

proxy-groups:
- name: 节点选择
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  proxies:
  - 自动测速
  - 香港节点
  - 美国节点
  - 日本节点
  - 新加坡节点
  - 其他节点
  - 手动切换
  - DIRECT

- name: 手动切换
  type: select
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

- name: 自动测速
  type: url-test
  include-all: true
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50

- name: 香港节点
  type: url-test
  include-all: true
  filter: "(?i)🇭🇰|港|HK|HKG|HongKong|Hong Kong|香港"
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50

- name: 美国节点
  type: url-test
  include-all: true
  filter: "(?i)🇺🇸|美|US|USA|United ?States|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago"
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/US.png"
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50

- name: 日本节点
  type: url-test
  include-all: true
  filter: "(?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|Tokyo|Osaka"
  url: https://cp.cloudflare.com/generate_204
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"
  interval: 300
  tolerance: 50

- name: 新加坡节点
  type: url-test
  include-all: true
  filter: "(?i)🇸🇬|SG|SGP|Singapore|新加坡|狮城"
  url: https://cp.cloudflare.com/generate_204
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"
  interval: 300
  tolerance: 50

- name: 其他节点
  type: select
  include-all: true
  exclude-filter: "(?i)🇭🇰|港|HK|HKG|HongKong|Hong Kong|香港|🇺🇸|美|US|USA|United ?States|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon Valley|Las Vegas|Los Angeles|San Jose|Santa Clara|Seattle|Chicago|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|Tokyo|Osaka|🇸🇬|SG|SGP|Singapore|新加坡|狮城"
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png"

- name: 全球直连
  type: select
  icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  proxies:
  - DIRECT
  - 节点选择

